backend:
  name: git-gateway
  repo: appdesign-jpn/flowers-by-syd
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/660b2cc7-4d16-46c0-8e70-eebc7eb9b54a/pkce
  auth_token_endpoint: /sites/660b2cc7-4d16-46c0-8e70-eebc7eb9b54a/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

media_folder: "images/gallery"
public_folder: "images/gallery"

site_url: https://flowersbysyd.com
display_url: https://flowersbysyd.com

collections:
  - name: "gallery"
    label: "Gallery Photos"
    description: "Add, edit, or remove the photos shown on your website's Gallery page."
    files:
      - name: "gallery"
        label: "Gallery Photos"
        file: "content/gallery.json"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            label_singular: "Photo"
            summary: "{{fields.caption}} — {{fields.category}}"
            fields:
              - label: "Photo"
                name: "image"
                widget: "image"
                hint: "Upload a photo — it'll be resized automatically by the site."
              - label: "Caption"
                name: "caption"
                widget: "string"
                hint: "Shows under the photo, e.g. \"Blush & Peach Wrapped Bouquet\""
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Bouquets", value: "bouquets" }
                  - { label: "Weddings", value: "weddings" }
                  - { label: "Events", value: "events" }
              - label: "Alt Text (optional)"
                name: "alt"
                widget: "string"
                required: false
                hint: "A short description for accessibility. If left blank, the caption is used."
